site_name: republic
repo_url: https://github.com/bubbuild/republic
site_url: https://getrepublic.org
site_description: A small LLM provider SDK for Python.
site_author: Bub Build
edit_uri: edit/main/docs/
repo_name: bubbuild/republic
copyright: Copyright (c) 2026 Bub Build contributors.

nav:
  - Home: index.md
  - Single-call Contract: contracts.md
  - OpenAI Chat Completions: openai-chat.md
  - OpenAI Responses: openai-responses.md
  - Anthropic Messages: anthropic-messages.md
  - ChatGPT Codex OAuth: codex-oauth.md
  - GitHub Copilot OAuth: copilot-oauth.md
  - Grok OAuth: grok-oauth.md
  - Rebuild Plan: rebuild-plan.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]

theme:
  name: terminal

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bubbuild/republic
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/republic

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
